{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'food/style.css' %}" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<title>Title</title>
</head>
<body>

 <!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark ">
    <div class="container-fluid">
        <a href="#" class="navbar-brand">BIDAR</a>  <!-- Toujours comme ça -->

        <!-- Bouton pour mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
<div class="collapse navbar-collapse" id="navbarNav">
    <div class="navbar-nav ms-auto">
        <a class="nav-item nav-link" href="{% url 'food:create_item' %}">Add/Create Item</a>
        <a class="nav-item nav-link" href="#">Delete Item</a>
        <a class="nav-item nav-link" href="#">View Item</a>

{% if user.is_authenticated %}
    <span class="navbar-text me-3">Welcome, {{ user.username }}!</span>

    <!-- Formulaire de déconnexion -->
    <form action="{% url 'logout' %}" method="POST" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="nav-item nav-link" style="background:none; border:none; color:inherit;">Logout</button>
    </form>

    <a class="nav-item nav-link" href="{% url 'profile' %}">Profile</a>
{% else %}
    <a class="nav-item nav-link" href="{% url 'login' %}">Login</a>
{% endif %}
    </div>
</div>
    </div>
</nav>
{% if messages %}
 {% for message in messages %}
<div class="alert alert-{{message.tags}}">
     {{message}}
</div>


 {% endfor %}


 {% endif %}


 <!-- BOBY PART DE MON SITE WEB -->

    {% block body %}
    {% endblock %}

<!-- PIEDS DE PAGE PART -->

</body>
</html>
