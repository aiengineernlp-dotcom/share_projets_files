{% extends 'food/base.html' %}
{% block body  %}
                                        <!-- DS -->


<div class="container">
    <form method="POST" style="
        max-width: 400px;
        margin: 50px auto;
        padding: 40px;
        background: rgba(20, 20, 30, 0.95);
        border-radius: 16px;
        box-shadow: 0px 0px 20px rgba(0, 200, 255, 0.6);
        text-align: center;
        color: #00eaff;
        font-family: 'Orbitron', sans-serif;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(0, 200, 255, 0.3);
        backdrop-filter: blur(10px);
    ">
        {% csrf_token %}
        <h2 style="
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 24px;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #00eaff, #0066ff);
            -webkit-background-clip: text;
            color: transparent;
            animation: glow 2s infinite alternate;
        ">
            🔹 ADD ITEM 🔹
        </h2>
        <div style="margin-bottom: 20px;">
            {{ form.as_p }}
        </div>
        <button type="submit" style="
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00eaff, #0066ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        " onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0px 0px 20px rgba(0, 200, 255, 0.8)';" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='none';">
            <span style="position: relative; z-index: 2;">🚀 Add 🚀</span>
            <span style="
                position: absolute;
                top: 50%;
                left: 50%;
                width: 300%;
                height: 300%;
                background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
                transform: translate(-50%, -50%) scale(0);
                transition: transform 0.5s ease;
                z-index: 1;
            "></span>
        </button>

        <!-- Effet des cercles lumineux -->
        <div style="
            position: absolute;
            top: -50px;
            left: -50px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.4), transparent);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        "></div>
        <div style="
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.3), transparent);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        "></div>
    </form>
</div>

<!-- Animations CSS -->
<style>
    @keyframes glow {
        0% { text-shadow: 0px 0px 5px rgba(0, 200, 255, 0.5); }
        100% { text-shadow: 0px 0px 20px rgba(0, 200, 255, 0.8); }
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
    }

    /* Style pour les champs du formulaire */
    input, select, textarea {
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(0, 200, 255, 0.3);
        border-radius: 8px;
        color: #00eaff;
        font-family: 'Orbitron', sans-serif;
        transition: all 0.3s ease;
        margin-bottom: 15px;
    }

    input:focus, select:focus, textarea:focus {
        background: rgba(255, 255, 255, 0.2);
        border-color: #00eaff;
        box-shadow: 0px 0px 10px rgba(0, 200, 255, 0.5);
        outline: none;
    }
</style>


<!-- POUR LUI -->
<div class="container">
    <div class="row">
        <div class="col-md-4 offset-md-4" >

            <div class="card">
                <div class="card-header bg-info">
                    <div class="card-title text-white">
                        ADD ITEM
                    </div>
                </div>
                <div class="card-body">
                    <form method="POST" >  <!--POST Car on veut poster les donnees dans la BD-->
    {% csrf_token %}
    {{form}}

    <button class="btn btn-info"  type="submit" >Add</button>

</form>
                </div>
            </div>

        </div>

    </div>
</div>


{% endblock %}
