{% extends 'food/base.html' %}

{% block body  %}
<div class="container my-5">
    <div class="row align-items-center">
        <!-- Image -->
        <div class="col-md-6 text-center">
            <img src="{{ item.item_image }}" alt="about image" class="img-fluid rounded shadow-sm" style="max-height: 300px;">
        </div>

        <!-- Détails du produit -->
        <div class="col-md-6">
            <h1 class="fw-bold">{{ object.item_name }}</h1>
            <h2 class="text-muted">{{ object.item_des }}</h2>
            <h3 class="text-success fw-bold">${{ object.item_price }}</h3>
            <a href="{% url 'food:delete_item' item.id %}">Delete</a>
        </div>
    </div>
</div>

{% endblock %}
