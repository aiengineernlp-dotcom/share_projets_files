# ==============================================
# FICHIER DE CONFIGURATION PYTEST
# ==============================================
#
# RÔLE PRINCIPAL :
# --------------
# Ce fichier pytest.ini configure l'environnement de test pour le projet.
# Il définit :
# - Les paramètres de test
# - Les marqueurs personnalisés
# - La configuration de la couverture
# - Les options de reporting
#
# RELATIONS AVEC LES AUTRES FICHIERS :
# ---------------------------------
# - tests/* : Fichiers de test
# - pyproject.toml : Configuration générale du projet
# - .coverage : Données de couverture de code
# - htmlcov/ : Rapports de couverture HTML
#
# STRUCTURE DU CONTENU :
# --------------------
# Le fichier est organisé en sections :
# 1. Configuration de base des tests
# 2. Marqueurs personnalisés pour catégoriser les tests
# 3. Configuration des plugins requis
# 4. Timeout par défaut
# 5. Configuration de la couverture de code
# 6. Exclusion de fichiers/dossiers
# 7. Configuration des doctests
# 8. Variables d'environnement pour les tests
#
# IMPORTANCE ET SUPPRESSION :
# -------------------------
# Ce fichier est CRITIQUE et ne doit PAS être supprimé car :
# - Il configure l'environnement de test
# - Il assure la cohérence des tests
# - Il est nécessaire pour l'intégration continue
# - Il définit les standards de test
#
# NOTE DE MAINTENANCE :
# -------------------
# - Maintenir à jour les marqueurs de test
# - Vérifier la couverture de code
# - Optimiser les exclusions
# - Documenter les changements dans CHANGELOG.md
#
# ==============================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options de base
addopts = 
    -v                  # Mode verbeux
    --tb=short         # Format court des tracebacks
    --cov=phase1_data_collection  # Mesure la couverture du code
    --cov-report=term-missing  # Rapport de couverture détaillé
    --cov-report=html  # Rapport HTML
    --doctest-modules  # Active les doctests
    -p no:warnings    # Désactive les warnings

# Marqueurs personnalisés
markers =
    slow: tests qui prennent du temps à s'exécuter
    integration: tests d'intégration
    unit: tests unitaires
    api: tests API
    db: tests base de données
    nlp: tests NLP
    scraper: tests scraper
    processor: tests processor
    storage: tests storage

# Configuration des tests
minversion = 6.0
required_plugins = 
    pytest-cov
    pytest-mock
    pytest-asyncio

# Timeout par défaut (en secondes)
timeout = 300

# Configuration de la couverture
[coverage:run]
branch = True
source = phase1_data_collection

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError:
    if TYPE_CHECKING:

# Ignorer certains fichiers/dossiers
norecursedirs = 
    *.egg
    .git
    .tox
    .env
    .venv
    venv
    dist
    build

# Configuration des doctests
doctest_optionflags = 
    NORMALIZE_WHITESPACE
    IGNORE_EXCEPTION_DETAIL
    ALLOW_UNICODE
    ALLOW_BYTES

# Variables d'environnement pour les tests
env =
    D:ENV=test
    D:DEBUG=True
    D:LOG_LEVEL=DEBUG
    D:DB_PATH=:memory: 