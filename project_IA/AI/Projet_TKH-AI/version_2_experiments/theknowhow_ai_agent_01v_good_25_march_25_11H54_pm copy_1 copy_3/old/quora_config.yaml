# Configuration pour le scraper Quora

# Paramètres d'authentification (à remplir)
auth:
  email: ""  # Votre email Quora
  password: ""  # Votre mot de passe Quora
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

# Paramètres de scraping
scraping:
  max_question_age_days: 30
  min_upvotes: 5
  collect_answers: true
  min_answer_upvotes: 3
  max_answers_per_question: 20
  language_filter: ["fr", "en"]

# Topics médicaux à suivre
medical_topics:
  - "Medicine"
  - "Healthcare"
  - "Medical-Advice"
  - "Doctors"
  - "Medical-Conditions"
  - "Medical-Science"
  - "Public-Health"
  - "Medical-Research"

# Espaces médicaux à suivre
medical_spaces:
  - "Medical-Professionals"
  - "Healthcare-Industry"
  - "Medical-Students"
  - "Medical-Research-and-Development"

# Paramètres de stockage
storage:
  database_path: "data/databases/quora_qa.db"
  backup_path: "data/backups/quora"

# Paramètres de logging
logging:
  level: "INFO"
  file_path: "data/logs/scraping/quora.log"
  max_size: 10485760  # 10 MB
  backup_count: 5

# Paramètres de connexion
connection:
  timeout: 30
  retry_attempts: 3
  retry_delay: 5
  rate_limit:
    max_requests: 100
    window_seconds: 60

# Paramètres de navigation
browser:
  headless: true
  load_timeout: 20
  scroll_pause_time: 2.0
  max_scroll_attempts: 10 