# Environnement de PRODUCTION
# ⚠️ ATTENTION : Ces credentials donnent accès aux données de production
# Assurez-vous de :
# - Ne jamais les commiter
# - Les stocker de manière sécurisée (ex: AWS Secrets Manager, HashiCorp Vault)
# - Limiter l'accès à ces credentials

social_media:
  twitter:
    api_key: "PROD_TWITTER_API_KEY"
    api_secret: "PROD_TWITTER_API_SECRET"
    access_token: "PROD_TWITTER_ACCESS_TOKEN"
    access_token_secret: "PROD_TWITTER_ACCESS_TOKEN_SECRET"
  
  facebook:
    app_id: "PROD_FACEBOOK_APP_ID"
    app_secret: "PROD_FACEBOOK_APP_SECRET"
    access_token: "PROD_FACEBOOK_ACCESS_TOKEN"
  
  linkedin:
    client_id: "PROD_LINKEDIN_CLIENT_ID"
    client_secret: "PROD_LINKEDIN_CLIENT_SECRET"
    access_token: "PROD_LINKEDIN_ACCESS_TOKEN"

medical_apis:
  pubmed:
    api_key: "PROD_PUBMED_API_KEY"
  
  clinicaltrials:
    api_key: "PROD_CLINICALTRIALS_API_KEY"
  
  nih:
    api_key: "PROD_NIH_API_KEY"
    
  who:
    api_key: "PROD_WHO_API_KEY"

translation:
  deepl:
    api_key: "PROD_DEEPL_API_KEY"

proxy_services:
  brightdata:
    username: "PROD_BRIGHTDATA_USERNAME"
    password: "PROD_BRIGHTDATA_PASSWORD"
    zone: "PROD_ZONE_ID"

# Sécurité :
# - Rotation régulière des clés (tous les 90 jours)
# - Monitoring des accès et utilisation
# - Alertes en cas d'utilisation suspecte
# - Backup sécurisé des credentials 