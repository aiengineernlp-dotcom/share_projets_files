# Configuration pour le scraper Telegram

# Paramètres d'API (à remplir)
api:
  api_id: ""  # Votre API ID Telegram
  api_hash: ""  # Votre API Hash Telegram
  phone_number: ""  # Votre numéro de téléphone au format international
  session_name: "medical_scraper"  # Nom de la session Telethon

# Paramètres de scraping
scraping:
  max_message_age_days: 30
  min_message_length: 10
  collect_media: false
  collect_documents: false
  batch_size: 100
  language_filter: ["fr", "en"]

# Canaux et groupes médicaux à suivre
medical_channels:
  - "MedicalUpdates"
  - "HealthcareProfessionals"
  - "MedicalNews"
  - "DoctorsNetwork"
  - "MedicalResearch"

# Mots-clés médicaux pour le filtrage
medical_keywords:
  - "diagnostic"
  - "traitement"
  - "symptômes"
  - "consultation"
  - "médical"
  - "clinique"
  - "pathologie"
  - "ordonnance"
  - "prescription"
  - "thérapie"

# Paramètres de stockage
storage:
  database_path: "data/databases/telegram_messages.db"
  media_path: "data/media/telegram"
  backup_path: "data/backups/telegram"

# Paramètres de logging
logging:
  level: "INFO"
  file_path: "data/logs/scraping/telegram.log"
  max_size: 10485760  # 10 MB
  backup_count: 5

# Paramètres de connexion
connection:
  timeout: 30
  retry_attempts: 3
  retry_delay: 5
  rate_limit:
    max_requests: 20
    window_seconds: 60  # Limite de l'API Telegram 