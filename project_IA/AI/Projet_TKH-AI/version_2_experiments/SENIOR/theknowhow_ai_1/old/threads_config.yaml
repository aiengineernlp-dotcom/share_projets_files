# Configuration pour le scraper Threads

# Paramètres d'authentification (à remplir)
auth:
  username: ""  # Votre nom d'utilisateur Instagram/Threads
  password: ""  # Votre mot de passe
  user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"

# Paramètres de scraping
scraping:
  max_thread_age_days: 30
  min_likes: 10
  min_replies: 5
  collect_replies: true
  collect_media: true
  max_threads_per_user: 100
  max_replies_per_thread: 50

# Comptes médicaux à suivre
medical_accounts:
  - "medicaldaily"
  - "doctorsofthreads"
  - "healthcarepros"
  - "medicaladvice"
  - "medicalresearch"

# Hashtags médicaux à suivre
medical_hashtags:
  - "medecine"
  - "healthcare"
  - "medical"
  - "doctors"
  - "health"
  - "medicalresearch"
  - "clinicalpractice"

# Paramètres de stockage
storage:
  database_path: "data/databases/threads_posts.db"
  media_path: "data/media/threads"
  backup_path: "data/backups/threads"

# Paramètres de logging
logging:
  level: "INFO"
  file_path: "data/logs/scraping/threads.log"
  max_size: 10485760  # 10 MB
  backup_count: 5

# Paramètres de connexion
connection:
  timeout: 30
  retry_attempts: 3
  retry_delay: 5
  rate_limit:
    max_requests: 100
    window_seconds: 60

# Paramètres de navigation
browser:
  headless: true
  load_timeout: 20
  scroll_pause_time: 2.0
  max_scroll_attempts: 10 