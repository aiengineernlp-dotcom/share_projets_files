# Configuration pour le scraper Doctissimo

# URL de base du site
base_url: "https://www.doctissimo.fr"

# Catégories à scraper
categories:
  - sante
  - medicaments
  - maladies
  - nutrition
  - grossesse-bebe
  - psychologie
  - beaute-mode
  - forme-sport

# Paramètres de scraping
scraping:
  max_pages_per_category: 10  # Nombre maximum de pages à scraper par catégorie
  max_concurrent_requests: 5   # Nombre maximum de requêtes simultanées
  request_delay: 1.0          # Délai entre les requêtes en secondes
  timeout: 30                 # Timeout des requêtes en secondes

# Headers HTTP pour les requêtes
headers:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
  Accept-Language: "fr-FR,fr;q=0.9,en-US;q=0.8,en;q=0.7"

# Configuration du stockage
storage:
  database_path: "data/databases/doctissimo.db"
  media_path: "data/media/doctissimo"
  backup_path: "data/backups/doctissimo"

# Configuration du logging
logging:
  file_path: "data/logs/doctissimo.log"
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Filtres de contenu
content_filters:
  min_content_length: 500     # Longueur minimale du contenu en caractères
  excluded_keywords:          # Mots-clés à exclure
    - "publicité"
    - "sponsorisé"
    - "partenaire"
  required_keywords:          # Au moins un de ces mots-clés doit être présent
    - "santé"
    - "médical"
    - "traitement"
    - "symptômes"
    - "diagnostic"
    - "maladie"
    - "médicament" 