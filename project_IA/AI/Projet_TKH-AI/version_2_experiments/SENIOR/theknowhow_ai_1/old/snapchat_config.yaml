# Configuration pour le scraper Snapchat

# Paramètres d'authentification (à remplir)
auth:
  username: ""  # Votre nom d'utilisateur Snapchat
  password: ""  # Votre mot de passe Snapchat
  user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 14_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/14.0.3 Mobile/15E148 Safari/604.1"

# Paramètres de scraping
scraping:
  max_story_age_hours: 24
  collect_media: true
  collect_text: true
  max_stories_per_user: 50
  media_types:
    - "image"
    - "video"
    - "text"

# Comptes médicaux à suivre
medical_accounts:
  - "medicaldaily"
  - "doctorsofsnap"
  - "medicalstudents"
  - "healthcarepros"
  - "medicaladvice"

# Paramètres de stockage
storage:
  database_path: "data/databases/snapchat_stories.db"
  media_path: "data/media/snapchat"
  backup_path: "data/backups/snapchat"
  media_format:
    images: "jpg"
    videos: "mp4"

# Paramètres de logging
logging:
  level: "INFO"
  file_path: "data/logs/scraping/snapchat.log"
  max_size: 10485760  # 10 MB
  backup_count: 5

# Paramètres de connexion
connection:
  timeout: 30
  retry_attempts: 3
  retry_delay: 5
  rate_limit:
    max_requests: 100
    window_seconds: 60

# Paramètres de navigation
browser:
  headless: true
  load_timeout: 20
  wait_between_actions: 2.0
  screenshot_on_error: true 