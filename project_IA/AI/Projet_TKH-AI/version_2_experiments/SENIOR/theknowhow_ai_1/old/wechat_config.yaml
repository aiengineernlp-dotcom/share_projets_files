# Configuration pour le scraper WeChat

# Paramètres d'authentification (à remplir)
auth:
  app_id: ""  # Votre App ID WeChat
  app_secret: ""  # Votre App Secret WeChat
  token: ""  # Votre token WeChat
  encoding_aes_key: ""  # Votre clé de cryptage AES

# Paramètres de scraping
scraping:
  max_message_age_days: 30
  collect_media: true
  collect_articles: true
  max_messages_per_account: 100
  content_types:
    - "text"
    - "image"
    - "video"
    - "article"
    - "link"

# Comptes officiels médicaux à suivre
medical_official_accounts:
  - "MedicalDaily"
  - "HealthcarePro"
  - "MedicalNews"
  - "DoctorsNetwork"
  - "ChineseMedicine"

# Paramètres de stockage
storage:
  database_path: "data/databases/wechat_messages.db"
  media_path: "data/media/wechat"
  backup_path: "data/backups/wechat"
  article_format: "html"

# Paramètres de logging
logging:
  level: "INFO"
  file_path: "data/logs/scraping/wechat.log"
  max_size: 10485760  # 10 MB
  backup_count: 5

# Paramètres de connexion
connection:
  timeout: 30
  retry_attempts: 3
  retry_delay: 5
  rate_limit:
    max_requests: 200
    window_seconds: 300

# Paramètres de traduction
translation:
  enabled: true
  source_lang: "zh"  # Chinois
  target_langs: ["fr", "en"]
  service: "google"  # ou "baidu", "youdao"

# Paramètres de filtrage
filtering:
  keywords:
    - "医疗"  # médical
    - "健康"  # santé
    - "医生"  # docteur
    - "诊断"  # diagnostic
    - "治疗"  # traitement
    - "症状"  # symptômes 